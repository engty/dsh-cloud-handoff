name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单测（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 单元测试（会话帧迁移 / 状态机 / 工作区扫描）
        run: node --test test/*.test.mjs

  modules:
    name: 语法与 bundle 配置检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 只做语法解析：宿主/客户端模块在运行时会从 DSH profile 解析 peer 依赖，
      # 干净检出里没有 node_modules，因此不做真实 import（那部分在发布清单的手工兼容性验证里做）。
      - name: 宿主与客户端模块语法检查
        run: |
          for f in lib/*.js lib/*.mjs; do node --check "$f" || exit 1; done
          echo "语法检查通过 ✓"
      - name: bundle 配置完整性（cordis.patch.yml / package.json 字段）
        run: |
          node -e "
          const p = require('./package.json');
          const fs = require('node:fs');
          const must = ['name','version','dsh','cordis','engines'];
          for (const k of must) if (!(k in p)) { console.error('缺少字段: ' + k); process.exit(1); }
          if (!fs.existsSync(p.dsh.bundle.patch)) { console.error('缺少 patch 文件'); process.exit(1); }
          if (!fs.existsSync('scripts/install-cloud.sh')) { console.error('缺少一键脚本'); process.exit(1); }
          console.log('bundle 配置完整 ✓');
          "
      - name: 一键脚本语法检查
        run: bash -n scripts/install-cloud.sh
      - name: npm 打包清单检查
        run: |
          npm pack --dry-run 2>&1 | tail -20
